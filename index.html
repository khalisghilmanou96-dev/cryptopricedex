<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CryptoPriceDex : recherche de cryptomonnaies, prix, market cap et variations via CoinLore." />
  <title>CryptoPriceDex — Prix des cryptomonnaies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Prix crypto · CoinLore API</p>
        <h1>CryptoPriceDex</h1>
        <p class="subtitle">Suis les prix des cryptomonnaies, leurs variations, volumes et capitalisations avec les données publiques CoinLore.</p>
      </div>
      <div class="hero-badge" aria-hidden="true">₿</div>
    </header>

    <main>
      <section class="controls" aria-label="Recherche crypto">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Ex. Bitcoin, Ethereum, Solana…" autocomplete="off" />
          <select id="currencySelect" aria-label="Devise">
            <option value="eur">EUR</option>
            <option value="usd">USD</option>
            <option value="gbp">GBP</option>
          </select>
          <button id="searchButton" type="button">Rechercher</button>
        </div>
        <button id="randomButton" class="secondary-button" type="button">🎲 Au hasard</button>
      </section>

      <p id="status" class="status" aria-live="polite"></p>

      <section>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Marché</p>
            <h2>Cryptos populaires</h2>
          </div>
          <button id="loadMoreButton" class="ghost-button" type="button">Afficher plus</button>
        </div>
        <div id="cryptoGrid" class="pokemon-grid"></div>
      </section>
    </main>
  </div>

  <div id="cryptoDialog" class="pokemon-dialog modal-hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-backdrop"></div><div class="modal-panel">
    <button id="closeDialogButton" class="close-button" type="button" aria-label="Fermer">×</button>
    <div id="cryptoDetails"></div>
  </div></div>

  <template id="cryptoCardTemplate">
    <article class="pokemon-card">
      <div class="card-topline">
        <span class="crypto-rank"></span>
        <span class="card-arrow">↗</span>
      </div>
      <img class="pokemon-image" src="" alt="" loading="lazy" />
      <div class="card-content">
        <h3 class="pokemon-name"></h3>
        <div class="pokemon-types"></div>
        <div class="price-row">
          <strong class="crypto-price"></strong>
          <span class="crypto-change"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
